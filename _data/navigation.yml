pages:
# One-page layout: `url` values are in-page anchors that jump to the matching
# <section id="..."> on the homepage (index.html) instead of loading a new page.
# NOTE: `name` must match the section id (lowercased) so the navbar highlights
#       the section currently in view. Home -> #home, Publications -> #publications, etc.
- name: Home
  url: /#home
- name: Publications
  url: /#publications
# Blog and Showcase sections are hidden — re-enable them in index.html and uncomment here.
# - name: Blog
#   url: /#blog
# - name: Showcase
#   url: /#showcase
