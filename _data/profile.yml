short_bio: >-
  <p>
    I am a robotics engineer at <a target="_blank" href="https://mujin-corp.com/">Mujin</a>@Tokyo. I have been working broadly on computer vision, artificial intelligence, and robotics. I am now also looking for PhD opportunities starting in 2027 or 2028 <img src="/assets/images/emoji/chiikawa-think.png" alt="chiikawa" style="height: 1.2em; vertical-align: text-bottom;">
  </p>
  <p>
    During my undergrad, I was a research student at <a target="_blank" href="https://www.pair.toronto.edu/">Pair Lab</a>@<a target="_blank" href="https://www.cc.gatech.edu/">Georgia Tech</a>, advised by <a target="_blank" href="https://animesh.garg.tech/">Prof. Animesh Garg</a>. I am very fortunate to have worked with him and <a target="_blank" href="https://gnosisyuw.github.io/">Dr. Wei Yu</a>.
  </p>
  <p>
    On the industry side, I have interned at Amazon@Seattle and SMBC@NYC, and worked at Tencent@Beijing as a backend infrastructure engineer.
  </p>
  <p>
    I have lived in Nanjing, Toronto, Vancouver, New York, Beijing, and now Tokyo. In my free time, I enjoy landscape photography and learning languages. I always love making new friends and finding ways to work together — feel free to reach out~ <img src="/assets/images/emoji/chiikawa.png" alt="chiikawa" style="height: 1.2em; vertical-align: text-bottom;">
  </p>
